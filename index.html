<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Screen Clock Background</title>
    <style>
      /* Force the page to cover the full monitor and remove scrollbars */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      /* Full screen background container */
      .background-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-image: url("img.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        justify-content: center;
      }

      /* Position the clock exactly 1/4 (25vh) from the top center */
      .clock-wrapper {
        position: absolute;
        top: 25vh;
        text-align: center;
        color: #ffffff;
        text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        user-select: none;
      }

      .time {
        font-size: 5.5rem;
        font-weight: 300;
        letter-spacing: -1px;
        line-height: 1;
      }

      .date {
        font-size: 1.5rem;
        font-weight: 400;
        margin-top: 10px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="background-container">
      <div class="clock-wrapper">
        <div id="clock" class="time">00:00:00</div>
        <div id="date" class="date">Friday, March 22</div>
      </div>
    </div>

    <script>
      function updateClock() {
        const now = new Date();

        // Strictly 24-hour format logic
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        // Standardize double digits
        hours = hours < 10 ? "0" + hours : hours;
        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        document.getElementById(
          "clock"
        ).textContent = `${hours}:${minutes}:${seconds}`;

        // Format date
        const options = { weekday: "long", month: "long", day: "numeric" };
        document.getElementById("date").textContent = now.toLocaleDateString(
          "en-US",
          options
        );
      }

      updateClock();
      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
